spring:
  application:
    name: rabbitmq-tutorials

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

    # La guia pone este bloque bajo "spring.amqp", pero esa propiedad no existe
    # en Spring Boot y se ignoraria sin avisar. La correcta es spring.rabbitmq.template.
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-interval: 30000
        multiplier: 2.0
server:
  port: 8080
