# Arquitectura Kafka: tres nodos Zookeeper, tres brokers y Kafka UI.
#
#   docker compose up -d
#
# Brokers desde el PC:  localhost:9092, localhost:9093 y localhost:9094
# Kafka UI:             http://localhost:8090

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.5.0
  restart: unless-stopped
  networks: [kafka_cluster]

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.5.0
  restart: unless-stopped
  depends_on: [zookeeper-1, zookeeper-2, zookeeper-3]
  networks: [kafka_cluster]

# Lo comun a los tres brokers. Cada uno agrega su id y sus listeners.
x-kafka-env: &kafka-env
  # El ensamble completo: si cae un Zookeeper, los otros dos mantienen el quorum.
  KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
  # INTERNO: entre brokers y para Kafka UI. EXTERNO: para los microservicios desde el PC.
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
  # Los topicos internos de Kafka (offsets de los consumer groups) tambien con 3 replicas.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  # Una escritura con acks=all necesita al menos 2 replicas al dia: tolera la caida de un broker.
  KAFKA_MIN_INSYNC_REPLICAS: 2
  # Los topicos se crean a proposito (microservicio o kafka-admin), nunca por accidente.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  zookeeper-1:
    <<: *zookeeper
    container_name: zookeeper-1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

  zookeeper-2:
    <<: *zookeeper
    container_name: zookeeper-2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

  zookeeper-3:
    <<: *zookeeper
    container_name: zookeeper-3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVERS: zookeeper-1:2888:3888;zookeeper-2:2888:3888;zookeeper-3:2888:3888

  kafka-1:
    <<: *kafka
    container_name: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-1:29092,EXTERNO://localhost:9092

  kafka-2:
    <<: *kafka
    container_name: kafka-2
    ports: ["9093:9093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-2:29092,EXTERNO://localhost:9093

  kafka-3:
    <<: *kafka
    container_name: kafka-3
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-3:29092,EXTERNO://localhost:9094

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2, kafka-3]
    ports: ["8090:8080"]   # el 8080 es del backend
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
    networks: [kafka_cluster]

networks:
  kafka_cluster:
    driver: bridge
