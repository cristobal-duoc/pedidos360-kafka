spring.application.name=pedidos360

# ---------- Seguridad: validar el JWT de Cognito ----------
# CAMBIA <REGION> y <USER_POOL_ID> por los tuyos (terraform output cognito_user_pool_id).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_jV63RQ8jF
# El client_id del cliente SPA (terraform output cognito_client_id).
cognito.client-id=5rmbpaeusn73rpqcj6dt3m6l59

# ---------- Base de datos ----------
# sslmode=require NO es opcional: RDS rechaza toda conexion en claro.
# DB_HOST/DB_USER/DB_PASS los inyecta ECS (Fase 5). En local, con Docker Postgres.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/pedidos360?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}

# JPA crea/actualiza la tabla a partir de tus @Entity.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Actuator (health check de ECS) ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
