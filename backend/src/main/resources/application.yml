spring:
  application:
    name: pedidos360

  # ---------- Seguridad: validar el JWT de Cognito ----------
  security:
    oauth2:
      resourceserver:
        jwt:
          # El emisor de los tokens: el user pool. En ECS lo inyecta Terraform (COGNITO_ISSUER_URI):
          # si el lab se reinicia y el pool se recrea con otro id, no hay que tocar el codigo.
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_liLLqLOCH}

  # ---------- Base de datos ----------
  # sslmode=require NO es opcional: RDS rechaza toda conexion en claro.
  # DB_HOST/DB_USER/DB_PASS/DB_SSLMODE los inyecta ECS (ecs.tf). En local, con Docker Postgres.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/pedidos360?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

  # JPA crea/actualiza la tabla a partir de tus @Entity.
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  # ---------- RabbitMQ: los TRES nodos del cluster ----------
  # Con un solo nodo en addresses el cluster no sirve: si cae ese, no hay broker.
  # RABBITMQ_ADDRESSES lo inyecta ECS. En local, el cluster de rabbitmq-cluster/.
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673,localhost:5674}
    address-shuffle-mode: random   # cada instancia parte por un nodo al azar
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    # Sin esto, con RabbitMQ caido cada POST esperaria 60 s antes de responder.
    connection-timeout: 3s

  # ---------- Kafka: los TRES brokers de kafka-cluster/ ----------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    producer:
      # Clave = id de la solicitud: todos sus eventos caen en la misma particion, en orden.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Valor = el DTO SolicitudEvento en JSON.
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Confirmado solo cuando lo tienen las replicas al dia (min.insync.replicas=2).
      acks: all
      retries: 3
      properties:
        enable.idempotence: true                # un reintento no duplica el evento
        spring.json.add.type.headers: false     # el consumidor no depende de esta clase Java
        max.block.ms: 3000                      # con Kafka caido, el POST no espera 60 s
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    admin:
      # Con Kafka caido el backend arranca igual: los topicos se crean cuando vuelva.
      operation-timeout: 10s

# ---------- Topicos Kafka: nombre y administracion de cada flujo ----------
# Los lee KafkaTopicosProperties. Ninguna clase escribe un nombre a mano.
kafka-topicos:
  creadas:                        # cada solicitud nueva: la consumen notificaciones y auditoria
    nombre: pedidos360.solicitudes.creadas
    particiones: 3
    replicas: 3
    retencion-ms: 604800000       # 7 dias: solo sirve mientras la solicitud espera respuesta
    cleanup-policy: delete
  resueltas:                      # cada aprobacion o rechazo: la consume auditoria
    nombre: pedidos360.solicitudes.resueltas
    particiones: 3
    replicas: 3
    retencion-ms: 2592000000      # 30 dias: historial de decisiones para auditoria
    cleanup-policy: delete
  min-insync-replicas: 2

# El client_id del cliente SPA. En ECS lo inyecta Terraform (COGNITO_CLIENT_ID).
cognito:
  client-id: ${COGNITO_CLIENT_ID:3849j7js478hf218snhck2ddhp}

# ---------- Mensajeria: TODOS los nombres en un solo lugar ----------
# Los lee MensajeriaProperties. Ninguna clase los escribe a mano.
mensajeria:
  exchanges:
    solicitudes: pedidos360.solicitudes   # direct
    eventos: pedidos360.eventos           # topic
  routing-keys:
    creada: solicitud.creada
    aprobada: solicitud.aprobada
    rechazada: solicitud.rechazada

# ---------- Actuator (health check de ECS) ----------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # RabbitMQ caido NO puede marcar al backend como enfermo: ECS reiniciaria la
  # task en bucle y se caeria tambien la API de solicitudes.
  health:
    rabbit:
      enabled: false
