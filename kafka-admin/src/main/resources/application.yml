spring:
  application:
    name: kafka-admin

  # ---------- Kafka: los TRES brokers de kafka-cluster/ ----------
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    admin:
      properties:
        # Con los brokers inalcanzables, cada peticion responde 503 en segundos y no en un minuto.
        request.timeout.ms: 5000
        default.api.timeout.ms: 8000

  # ---------- Seguridad: validar el JWT de Cognito, igual que el backend ----------
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_liLLqLOCH}

# El client_id del cliente SPA: el access token de Cognito lo trae en vez de "aud".
cognito:
  client-id: ${COGNITO_CLIENT_ID:3849j7js478hf218snhck2ddhp}

# El 8080 es del backend de solicitudes y el 8097 del rabbit-admin.
server:
  port: 8098
